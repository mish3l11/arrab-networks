<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الدروس | عرّاب الشبكات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Tajawal", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(203,183,122,0.08), transparent 30%),
                linear-gradient(135deg, #080b10, #10151d 55%, #080b10);
            color: #fff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 10, 15, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(203,183,122,0.16);
        }

        .topbar-inner {
            max-width: 1200px;
            margin: auto;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #cbb77a;
            color: #111;
            font-size: 22px;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 18px;
            color: #cbb77a;
        }

        .brand-text span {
            font-size: 10px;
            letter-spacing: 2px;
            color: #777;
        }

        .back-btn {
            padding: 10px 18px;
            border: 1px solid rgba(203,183,122,0.25);
            border-radius: 10px;
            color: #cbb77a;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #cbb77a;
            color: #111;
        }

        /* =========================
           PAGE
        ========================= */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 45px 22px 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .hero-badge {
            display: inline-block;
            padding: 7px 15px;
            border-radius: 30px;
            background: rgba(203,183,122,0.08);
            border: 1px solid rgba(203,183,122,0.18);
            color: #cbb77a;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .hero h2 {
            margin: 0;
            font-size: clamp(30px, 5vw, 46px);
            color: #fff;
        }

        .hero p {
            max-width: 700px;
            margin: 15px auto 0;
            color: #9ca3af;
            line-height: 1.9;
        }

        /* =========================
           OVERALL PROGRESS
        ========================= */

        .overall-progress {
            margin-bottom: 45px;
            padding: 22px;
            border-radius: 18px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(203,183,122,0.14);
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .progress-title {
            color: #cbb77a;
            font-weight: 700;
        }

        .progress-number {
            color: #fff;
            font-weight: 700;
        }

        .progress-track {
            height: 9px;
            background: #20252d;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(
                90deg,
                #cbb77a,
                #e4d49e
            );
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        /* =========================
           PATH
        ========================= */

        .path {
            margin-bottom: 42px;
        }

        .path-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            padding: 18px 20px;
            border-radius: 16px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .path-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            background: rgba(203,183,122,0.08);
        }

        .path-title {
            flex: 1;
        }

        .path-title h3 {
            margin: 0 0 5px;
            font-size: 21px;
        }

        .path-title p {
            margin: 0;
            color: #858c96;
            font-size: 13px;
        }

        .path-progress {
            color: #cbb77a;
            font-size: 13px;
            white-space: nowrap;
        }

        /* =========================
           LESSON GRID
        ========================= */

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .lesson-card {
            position: relative;
            padding: 21px;
            border-radius: 16px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.015)
                );
            border: 1px solid rgba(255,255,255,0.07);
            transition: 0.25s ease;
            overflow: hidden;
        }

        .lesson-card::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: #075985;
            opacity: 0.8;
        }

        .lesson-card:hover {
            transform: translateY(-3px);
            border-color: rgba(203,183,122,0.25);
        }

        .lesson-card.completed {
            border-color: rgba(74, 222, 128, 0.25);
        }

        .lesson-card.completed::before {
            background: #22c55e;
        }

        .lesson-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .lesson-number {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(7,89,133,0.15);
            color: #7dd3fc;
            font-weight: 800;
            flex-shrink: 0;
        }

        .lesson-card.completed .lesson-number {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .lesson-status {
            font-size: 12px;
            color: #777;
        }

        .lesson-card.completed .lesson-status {
            color: #4ade80;
        }

        .lesson-card h4 {
            margin: 16px 0 8px;
            font-size: 18px;
        }

        .lesson-card p {
            margin: 0;
            color: #8f969f;
            line-height: 1.8;
            font-size: 13px;
        }

        .lesson-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            padding: 9px 17px;
            border-radius: 9px;
            background: rgba(203,183,122,0.08);
            border: 1px solid rgba(203,183,122,0.18);
            color: #cbb77a;
            font-size: 13px;
            font-weight: 700;
            transition: 0.2s;
        }

        .lesson-btn:hover {
            background: #cbb77a;
            color: #111;
        }

        /* =========================
           TROUBLESHOOTING
        ========================= */

        .training-card {
            margin-top: 16px;
            padding: 24px;
            border-radius: 18px;
            background:
                linear-gradient(
                    135deg,
                    rgba(203,183,122,0.08),
                    rgba(7,89,133,0.08)
                );
            border: 1px solid rgba(203,183,122,0.2);
            position: relative;
            overflow: hidden;
        }

        .training-card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #cbb77a,
                transparent
            );
        }

        .training-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .training-info {
            display: flex;
            align-items: center;
            gap: 17px;
        }

        .training-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(203,183,122,0.12);
            font-size: 27px;
            flex-shrink: 0;
        }

        .training-info h4 {
            margin: 0 0 7px;
            font-size: 19px;
            color: #fff;
        }

        .training-info p {
            margin: 0;
            color: #9299a3;
            line-height: 1.8;
            font-size: 13px;
        }

        .training-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 10px;
            background: #cbb77a;
            color: #111;
            font-weight: 800;
            white-space: nowrap;
            transition: 0.2s;
        }

        .training-btn:hover {
            transform: translateY(-2px);
            background: #dfcc8d;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 750px) {

            .topbar-inner {
                padding: 14px 16px;
            }

            .container {
                padding: 32px 16px 60px;
            }

            .lessons-grid {
                grid-template-columns: 1fr;
            }

            .path-header {
                align-items: flex-start;
            }

            .path-progress {
                display: none;
            }

            .training-content {
                flex-direction: column;
                align-items: stretch;
            }

            .training-btn {
                width: 100%;
            }

            .training-info {
                align-items: flex-start;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="topbar">

        <div class="topbar-inner">

            <a href="index.html" class="brand">

                <div class="brand-icon">
                    🌐
                </div>

                <div class="brand-text">

                    <h1>عرّاب الشبكات</h1>

                    <span>NETWORKS</span>

                </div>

            </a>

            <a href="index.html" class="back-btn">
                الرئيسية
            </a>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <section class="hero">

            <div class="hero-badge">
                📚 مسار التعلم
            </div>

            <h2>
                دروس الشبكات
            </h2>

            <p>
                تعلم أساسيات الشبكات خطوة بخطوة،
                من المفاهيم الأساسية إلى Routing
                وTroubleshooting وإدارة الشبكات.
            </p>

        </section>


        <!-- =========================
             OVERALL PROGRESS
        ========================= -->

        <section class="overall-progress">

            <div class="progress-top">

                <span class="progress-title">
                    تقدمك في الدروس
                </span>

                <span
                    class="progress-number"
                    id="overallProgressText"
                >
                    0%
                </span>

            </div>

            <div class="progress-track">

                <div
                    class="progress-fill"
                    id="overallProgressFill"
                ></div>

            </div>

        </section>


        <!-- =========================
             PATHS
        ========================= -->

        <div id="pathsContainer"></div>

    </main>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        /* ==========================================
           بيانات المسارات
        ========================================== */

        const paths = [

            {
                icon: "🌐",
                title: "المسار الأول — أساسيات الشبكات",
                description: "ابدأ من الأساس وتعرف على أهم مفاهيم الشبكات.",
                lessons: [

                    {
                        id: 1,
                        title: "أساسيات الشبكات",
                        description: "تعرف على مفهوم الشبكة وأنواع الشبكات وأساسيات الاتصال."
                    },

                    {
                        id: 2,
                        title: "أجهزة الشبكة",
                        description: "تعرف على Router وSwitch وHub وAccess Point وغيرها."
                    },

                    {
                        id: 3,
                        title: "IPv4 وعناوين IP",
                        description: "افهم عناوين IP وطريقة استخدامها داخل الشبكات."
                    },

                    {
                        id: 4,
                        title: "MAC Address",
                        description: "تعرف على عنوان MAC ودوره في عملية الاتصال."
                    },

                    {
                        id: 5,
                        title: "Ports & Protocols",
                        description: "تعرف على المنافذ والبروتوكولات المستخدمة في الشبكات."
                    },

                    {
                        id: 6,
                        title: "OSI Model",
                        description: "افهم طبقات نموذج OSI ووظيفة كل طبقة."
                    },

                    {
                        id: 7,
                        title: "TCP/IP",
                        description: "تعرف على نموذج TCP/IP وعلاقته بالشبكات."
                    },

                    {
                        id: 8,
                        title: "Hub vs Switch vs Router",
                        description: "تعرف على الفرق بين أهم أجهزة الشبكة."
                    }

                ]
            },


            {
                icon: "🔵",
                title: "المسار الثاني — Switching",
                description: "تعلم كيفية عمل السويتشات والـ VLANs.",
                lessons: [

                    {
                        id: 9,
                        title: "Subnetting",
                        description: "تعلم تقسيم الشبكات وحساب عدد الأجهزة والشبكات."
                    },

                    {
                        id: 10,
                        title: "Switching",
                        description: "افهم آلية عمل السويتش وكيف يتعامل مع البيانات."
                    },

                    {
                        id: 11,
                        title: "VLAN",
                        description: "تعلم إنشاء VLAN وربط المنافذ بها."
                    }

                ]
            },


            {
                icon: "🟠",
                title: "المسار الثالث — Routing",
                description: "تعلم كيفية انتقال البيانات بين الشبكات.",
                lessons: [

                    {
                        id: 12,
                        title: "Routing",
                        description: "تعرف على مفهوم التوجيه وكيف يختار الراوتر المسار."
                    },

                    {
                        id: 13,
                        title: "Static Routing",
                        description: "تعلم إضافة المسارات الثابتة بين الشبكات."
                    },

                    {
                        id: 14,
                        title: "OSPF",
                        description: "تعلم أساسيات بروتوكول OSPF والتوجيه الديناميكي."
                    }

                ]
            },


            {
                icon: "🛡️",
                title: "المسار الرابع — إدارة وحماية الشبكات",
                description: "تعلم إدارة الأجهزة وحماية الشبكة.",
                lessons: [

                    {
                        id: 15,
                        title: "SSH وإدارة الأجهزة",
                        description: "تعلم الدخول إلى أجهزة الشبكة وإدارتها عن بعد."
                    },

                    {
                        id: 16,
                        title: "Network Security",
                        description: "تعرف على أساسيات حماية الشبكات والأجهزة."
                    }

                ]
            },


            {
                icon: "🛠️",
                title: "المسار الخامس — Troubleshooting",
                description: "تعلم اكتشاف الأعطال وإصلاح مشاكل الشبكات عمليًا.",
                lessons: [

                    {
                        id: 17,
                        title: "Troubleshooting",
                        description: "تعلم منهجية اكتشاف مشاكل الشبكات وتحليلها وإصلاحها."
                    }

                ],

                training: true

            }

        ];


        /* ==========================================
           الحالة
        ========================================== */

        let completedLessons = [];


        /* ==========================================
           تحميل تقدم المستخدم
        ========================================== */

        async function loadProgress() {

            try {

                const {
                    data: {
                        session
                    }
                } = await supabaseClient.auth.getSession();


                if (!session) {

                    window.location.href =
                        "login.html";

                    return;

                }


                const {
                    data,
                    error
                } = await supabaseClient
                    .from("users")
                    .select("completed_lessons")
                    .eq("auth_id", session.user.id)
                    .single();


                if (error) {

                    console.error(error);

                    completedLessons = [];

                } else {

                    completedLessons =
                        Array.isArray(data?.completed_lessons)
                            ? data.completed_lessons
                            : [];

                }


                renderPaths();

            } catch (error) {

                console.error(error);

            }

        }


        /* ==========================================
           عرض المسارات
        ========================================== */

        function renderPaths() {

            const container =
                document.getElementById(
                    "pathsContainer"
                );


            if (!container) return;


            container.innerHTML = "";


            paths.forEach((path, pathIndex) => {

                const completedCount =
                    path.lessons.filter(
                        lesson =>
                            completedLessons.includes(
                                lesson.id
                            )
                    ).length;


                const totalLessons =
                    path.lessons.length;


                const percentage =
                    totalLessons > 0
                        ? Math.round(
                            (completedCount /
                                totalLessons) *
                            100
                        )
                        : 0;


                const pathElement =
                    document.createElement("section");


                pathElement.className = "path";


                pathElement.innerHTML = `

                    <div class="path-header">

                        <div class="path-icon">
                            ${path.icon}
                        </div>

                        <div class="path-title">

                            <h3>
                                ${path.title}
                            </h3>

                            <p>
                                ${path.description}
                            </p>

                        </div>

                        <div class="path-progress">
                            ${completedCount} / ${totalLessons}
                        </div>

                    </div>


                    <div class="lessons-grid">

                        ${path.lessons.map(lesson => {

                            const completed =
                                completedLessons.includes(
                                    lesson.id
                                );


                            return `

                                <article
                                    class="lesson-card ${
                                        completed
                                            ? "completed"
                                            : ""
                                    }"
                                >

                                    <div class="lesson-top">

                                        <div class="lesson-number">
                                            ${lesson.id}
                                        </div>

                                        <div class="lesson-status">

                                            ${
                                                completed
                                                    ? "✓ مكتمل"
                                                    : "غير مكتمل"
                                            }

                                        </div>

                                    </div>


                                    <h4>
                                        ${lesson.title}
                                    </h4>


                                    <p>
                                        ${lesson.description}
                                    </p>


                                    <a
                                        href="lesson.html?id=${lesson.id}"
                                        class="lesson-btn"
                                    >
                                        ${
                                            completed
                                                ? "مراجعة الدرس"
                                                : "ابدأ الدرس"
                                        }
                                    </a>

                                </article>

                            `;

                        }).join("")}

                    </div>


                    ${
                        path.training
                            ? `

                                <div class="training-card">

                                    <div class="training-content">

                                        <div class="training-info">

                                            <div class="training-icon">
                                                🛠️
                                            </div>

                                            <div>

                                                <h4>
                                                    الأعطال التدريبية
                                                </h4>

                                                <p>
                                                    اختبر مهارتك في اكتشاف
                                                    أعطال الشبكات وإصلاحها
                                                    باستخدام أوامر Cisco
                                                    وHuawei بشكل عملي.
                                                </p>

                                            </div>

                                        </div>


                                        <a
                                            href="troubleshooting.html"
                                            class="training-btn"
                                        >
                                            🛠️ ابدأ التدريب العملي
                                        </a>

                                    </div>

                                </div>

                            `
                            : ""
                    }

                `;


                container.appendChild(
                    pathElement
                );

            });


            updateOverallProgress();

        }


        /* ==========================================
           التقدم العام
        ========================================== */

        function updateOverallProgress() {

            const totalLessons = 17;


            const validCompleted =
                completedLessons.filter(
                    id =>
                        Number(id) >= 1 &&
                        Number(id) <= 17
                );


            const uniqueCompleted =
                [...new Set(
                    validCompleted.map(Number)
                )];


            const percentage =
                Math.round(
                    (uniqueCompleted.length /
                        totalLessons) *
                    100
                );


            const text =
                document.getElementById(
                    "overallProgressText"
                );


            const fill =
                document.getElementById(
                    "overallProgressFill"
                );


            if (text) {

                text.textContent =
                    `${percentage}%`;

            }


            if (fill) {

                fill.style.width =
                    `${percentage}%`;

            }

        }


        /* ==========================================
           التشغيل
        ========================================== */

        loadProgress();

    </script>

</body>

</html>
