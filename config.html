<style>
.config-wrapper{max-width:1250px;margin:auto;padding:20px 16px 50px}
.config-hero{text-align:center;padding:30px 16px}
.config-hero-image{max-width:100%;height:auto;border-radius:18px}

.command-toolbar{
background:#10243a;border:1px solid #315573;border-radius:20px;
padding:16px;margin-bottom:22px;display:grid;
grid-template-columns:minmax(200px,1fr) auto;gap:12px
}
.command-search{
display:flex;align-items:center;gap:10px;background:#0b1726;
border:1px solid #315573;border-radius:12px;padding:0 12px;min-height:48px
}
.command-search input{
width:100%;background:transparent;border:0;outline:0;
color:#f1f5f9;font:inherit
}
.command-search input::placeholder{color:#aabbd0}

.command-filters-new{display:flex;gap:8px;flex-wrap:wrap}
.filter-button{
background:#18334d;color:#f1f5f9;border:1px solid #315573;
border-radius:10px;padding:10px 15px;font:inherit;font-weight:bold;cursor:pointer
}
.filter-button.active,.filter-button:hover{background:#ebc45b;color:#111827}

.commands-layout-new{
display:grid;grid-template-columns:235px minmax(0,1fr);
gap:20px;align-items:start
}
.commands-sidebar-new,.command-section-new{
background:#10243a;border:1px solid #315573;border-radius:18px;padding:14px
}
.commands-sidebar-new{position:sticky;top:12px}
.sidebar-title{
color:#f1d27a;font-weight:900;padding:8px 8px 12px;
border-bottom:1px solid #315573
}
.commands-sidebar-new ul{list-style:none;margin:8px 0 0;padding:0}
.commands-sidebar-new li{margin:4px 0}
.commands-sidebar-new a{
display:block;text-decoration:none;color:#e2e8f0;
padding:9px;border-radius:9px;font-size:12px
}
.commands-sidebar-new a:hover{background:#ebc45b;color:#111827}

.commands-content-new{min-width:0}
.command-section-new{margin-bottom:18px;scroll-margin-top:15px;padding:18px}
.command-section-header{
display:flex;justify-content:space-between;align-items:center;gap:12px;
border-bottom:1px solid #315573;padding-bottom:12px;margin-bottom:15px
}
.command-section-header h2{color:#ffdc82;font-size:21px;margin:0}
.section-number{
background:#1b3b57;color:#ffdc82;border-radius:9px;
padding:8px 12px;font-weight:900
}
.command-head,.command-row-new{
display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.command-head{margin-bottom:8px}
.command-head div{
background:#1b3b57;color:#f1d27a;border-radius:9px;
padding:10px;font-size:12px;font-weight:bold
}
.command-row-new{margin-bottom:10px}
.command-cell-new{
min-width:0;background:#172d43;border:1px solid #315573;
border-radius:13px;padding:13px
}
.command-cell-new small{
display:block;color:#7dd3fc;font-weight:900;margin-bottom:7px
}
.command-cell-new h3{color:#f1f5f9;font-size:14px;margin:0 0 8px}
.command-cell-new p{color:#cbd5e1;font-size:12px;line-height:1.8}
.command-cell-new pre{
background:#080f19;border:1px solid #315573;color:#f8fafc;
border-radius:9px;padding:12px;overflow-x:auto;direction:ltr;
text-align:left;white-space:pre;margin:0 0 10px
}
.command-cell-new code{
color:#f8fafc;font:12px/1.8 Consolas,Monaco,monospace
}
.copy-button-new{
width:100%;min-height:38px;background:#075985;color:white;
border:0;border-radius:9px;font:inherit;font-size:12px;
font-weight:bold;cursor:pointer
}
.command-note{
background:#142f45;color:#e2e8f0;border-right:4px solid #ebc45b;
padding:12px;border-radius:9px;font-size:12px;line-height:1.8
}
.empty-results{display:none;color:#e2e8f0;padding:18px;text-align:center}

@media(max-width:850px){
.command-toolbar{grid-template-columns:1fr}
.command-filters-new{overflow-x:auto;flex-wrap:nowrap}
.filter-button{flex:0 0 auto}
.commands-layout-new{display:block}
.commands-sidebar-new{position:static;margin-bottom:14px}
.sidebar-title{display:none}
.commands-sidebar-new ul{display:flex;gap:6px;overflow-x:auto}
.commands-sidebar-new li{flex:0 0 auto}
.commands-sidebar-new a{
min-width:120px;text-align:center;background:#18334d;
border:1px solid #315573;color:#f1f5f9
}
.command-section-new{padding:12px}
.command-section-header h2{font-size:18px}
.command-head{display:none}
.command-row-new{display:flex;flex-direction:column;gap:8px}
.command-cell-new pre{white-space:pre-wrap;overflow-wrap:anywhere}
}
</style>

<script>
const sections = [
["basic","الإعداد الأساسي",[
["الدخول لوضع الإدارة","enable","الدخول لوضع النظام","system-view"],
["تغيير اسم الجهاز","hostname SW1","تغيير اسم الجهاز","sysname SW1"],
["عرض إصدار الجهاز","show version","عرض إصدار الجهاز","display version"]
]],
["vlan","VLAN",[
["إنشاء VLAN","vlan 10","إنشاء VLAN","vlan 10"],
["عرض VLAN","show vlan brief","عرض VLAN","display vlan"],
["عرض VLAN محددة","show vlan id 10","عرض VLAN محددة","display vlan 10"]
]],
["access","Access Port",[
["وضع Access","switchport mode access","وضع Access","port link-type access"],
["تحديد VLAN للمنفذ","switchport access vlan 10","تحديد VLAN للمنفذ","port default vlan 10"],
["تشغيل المنفذ","no shutdown","تشغيل المنفذ","undo shutdown"],
["إيقاف المنفذ","shutdown","إيقاف المنفذ","shutdown"],
["وصف المنفذ","description Camera-01","وصف المنفذ","description Camera-01"],
["Voice VLAN","switchport voice vlan 20","Voice VLAN","voice-vlan 20 enable"],
["عرض حالة Access","show interfaces switchport","عرض VLAN والمنافذ","display port vlan"]
],"Access Port يُستخدم عادةً للأجهزة النهائية، ويمكن استخدام Voice VLAN في بيئات الهواتف الشبكية."],
["trunk","Trunk",[
["وضع Trunk","switchport mode trunk","وضع Trunk","port link-type trunk"],
["السماح بـ VLANs","switchport trunk allowed vlan 10,20,30","السماح بـ VLANs","port trunk allow-pass vlan 10 20 30"],
["إضافة VLAN إلى Trunk","switchport trunk allowed vlan add 40","إضافة VLAN إلى Trunk","port trunk allow-pass vlan 40"],
["إزالة VLAN من Trunk","switchport trunk allowed vlan remove 20","إزالة VLAN من Trunk","undo port trunk allow-pass vlan 20"],
["السماح بكل VLANs","switchport trunk allowed vlan all","السماح بكل VLANs","port trunk allow-pass vlan all"],
["Native VLAN","switchport trunk native vlan 10","PVID للـ Trunk","port trunk pvid vlan 10"],
["عرض Trunk","show interfaces trunk","عرض VLAN والمنافذ","display port vlan"]
],"تأكد من السماح بمرور VLANs المطلوبة على طرفي وصلة Trunk."],
["interface","Interface & Status",[
["حالة Interface","show interfaces GigabitEthernet0/1","حالة Interface","display interface GigabitEthernet 0/0/1"],
["وصف المنافذ","show interfaces description","وصف المنافذ","display interface description"],
["أخطاء المنافذ","show interfaces counters errors","أخطاء المنافذ","display interface counters errors"],
["Transceiver","show interfaces transceiver","Transceiver","display transceiver"]
]],
["routing","Static Routing",[
["Static Route","ip route 192.168.20.0 255.255.255.0 10.0.0.2","Static Route","ip route-static 192.168.20.0 255.255.255.0 10.0.0.2"],
["عرض Static Routes","show ip route static","عرض Static Routes","display ip routing-table protocol static"]
]],
["ospf","OSPF",[
["تشغيل OSPF","router ospf 1","تشغيل OSPF","ospf 1"],
["عرض الجيران","show ip ospf neighbor","عرض الجيران","display ospf peer"],
["OSPF Interface","show ip ospf interface brief","OSPF Interface","display ospf interface"],
["عرض OSPF Routes","show ip route ospf","عرض OSPF Routes","display ip routing-table protocol ospf"]
]],
["stp","STP",[
["عرض STP","show spanning-tree","عرض STP","display stp"],
["PortFast","spanning-tree portfast","Edge Port","stp edged-port enable"]
]],
["ethtrunk","Eth-Trunk / Port-Channel",[
["LACP","channel-group 1 mode active","LACP","interface Eth-Trunk 1\nmode lacp-static"]
]],
["dhcp","DHCP",[
["عرض DHCP Bindings","show ip dhcp binding","عرض معلومات DHCP","display ip pool"],
["DHCP Snooping","ip dhcp snooping","DHCP Snooping","dhcp snooping enable"]
]],
["ssh","SSH",[
["حالة SSH","show ssh","حالة SSH","display ssh server status"],
["المستخدمون المتصلون","show users","المستخدمون المتصلون","display users"]
]],
["acl","ACL",[
["عرض ACL","show access-lists","عرض ACL","display acl 3000"]
],"أوامر ACL تختلف في الصياغة وطريقة التطبيق بين Cisco وHuawei."],
["troubleshooting","Troubleshooting",[
["Ping","ping 192.168.1.1","Ping","ping 192.168.1.1"],
["Traceroute","traceroute 192.168.1.1","Tracert","tracert 192.168.1.1"],
["CPU","show processes cpu","CPU","display cpu-usage"],
["Logs","show logging","Logs","display logbuffer"]
]],
["save","Save Configuration",[
["حفظ الإعدادات","copy running-config startup-config","حفظ الإعدادات","save"],
["إعادة التشغيل","reload","إعادة التشغيل","reboot"]
]],
["system","System Management",[
["الوقت","show clock","الوقت","display clock"],
["المستخدمون","show users","المستخدمون","display users"]
]],
["hardware","Device & Hardware",[
["Inventory","show inventory","Electronic Label","display elabel"],
["Fan","show environment fan","Fan","display fan"]
]],
["layer3","Layer 3 Interface",[
["SVI","interface Vlan 10\nip address 192.168.10.1 255.255.255.0\nno shutdown","Vlanif","interface Vlanif 10\nip address 192.168.10.1 255.255.255.0\nundo shutdown"],
["تحويل Port إلى Layer 3","no switchport","تحويل Port إلى Layer 3","undo portswitch"]
]],
["security","Port Security",[
["تفعيل Port Security","switchport port-security","تفعيل Port Security","port-security enable"],
["تحديد عدد MAC","switchport port-security maximum 2","تحديد عدد MAC","port-security max-mac-num 2"],
["عرض Port Security","show port-security","عرض Port Security","display port-security"]
]],
["stpconfig","STP Configuration",[
["تحديد Root Priority","spanning-tree vlan 10 priority 4096","تحديد Root Priority","stp vlan 10 priority 4096"],
["Root Primary","spanning-tree vlan 10 root primary","Root Primary","stp root primary"]
],"قد تختلف أوامر STP حسب موديل الجهاز وإصدار النظام."],
["vlantshoot","VLAN Troubleshooting",[
["عرض Trunk","show interfaces trunk","عرض VLAN على المنافذ","display port vlan"],
["MAC على منفذ","show mac address-table interface GigabitEthernet0/1","MAC على منفذ","display mac-address interface GigabitEthernet 0/0/1"],
["MAC حسب VLAN","show mac address-table vlan 10","MAC حسب VLAN","display mac-address vlan 10"],
["البحث عن MAC","show mac address-table address 0011.2233.4455","البحث عن MAC","display mac-address 0011-2233-4455"],
["البحث عن IP في ARP","show arp 192.168.1.10","البحث عن IP في ARP","display arp | include 192.168.1.10"],
["الجيران","show cdp neighbors detail","الجيران","display lldp neighbor verbose"],
["البحث داخل الإعدادات","show running-config | include vlan","البحث داخل الإعدادات","display current-configuration | include vlan"],
["البحث عن Route","show running-config | include ip route","البحث عن Route","display current-configuration | include ip route-static"],
["إعدادات Interface","show running-config interface GigabitEthernet0/1","إعدادات Interface","display current-configuration interface GigabitEthernet 0/0/1"],
["البحث عن SSH","show running-config | include ssh","البحث عن SSH","display current-configuration | include ssh"]
],"قد تختلف بعض أوامر Huawei حسب موديل الجهاز وإصدار VRP."]
];

const links = document.getElementById("sectionLinks");
const content = document.getElementById("commandsContent");

const escapeHTML = text => String(text).replace(/[&<>"']/g, char => ({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[char]));

sections.forEach((section,index)=>{
const linkItem=document.createElement("li");
linkItem.innerHTML=`<a href="#${section[0]}">${String(index+1).padStart(2,"0")} — ${escapeHTML(section[1])}</a>`;
links.appendChild(linkItem);

const sectionElement=document.createElement("section");
sectionElement.className="command-section-new command-section";
sectionElement.id=section[0];

sectionElement.innerHTML=`
<div class="command-section-header">
<h2>${escapeHTML(section[1])}</h2>
<span class="section-number">${String(index+1).padStart(2,"0")}</span>
</div>
<div class="command-head">
<div>🔵 Cisco IOS</div>
<div>🟢 Huawei VRP</div>
</div>
<div class="rows"></div>
${section[3]?`<div class="command-note">${escapeHTML(section[3])}</div>`:""}
`;

section[2].forEach(item=>{
const row=document.createElement("div");
row.className="command-row-new";

row.innerHTML=[0,1].map(side=>{
const vendor=side?"Huawei":"Cisco";
const title=item[side?2:0];
const command=item[side?3:1];

return `
<article class="command-cell-new" data-vendor="${vendor.toLowerCase()}">
<small>${vendor}</small>
<h3>${escapeHTML(title)}</h3>
<pre><code>${escapeHTML(command)}</code></pre>
<button class="copy-button-new" type="button">📋 نسخ</button>
</article>`;
}).join("");

sectionElement.querySelector(".rows").appendChild(row);
});

content.appendChild(sectionElement);
});

let activeFilter="all";

function updateResults(){
const query=document.getElementById("commandSearch").value.trim().toLowerCase();
let visibleSections=0;

document.querySelectorAll(".command-section").forEach(section=>{
let sectionMatches=false;

section.querySelectorAll(".command-row-new").forEach(row=>{
let visibleCells=0;

row.querySelectorAll(".command-cell-new").forEach(cell=>{
const vendorMatches=activeFilter==="all" || cell.dataset.vendor===activeFilter;
const textMatches=!query || cell.innerText.toLowerCase().includes(query);
const visible=vendorMatches && textMatches;

cell.style.display=visible?"":"none";
if(visible) visibleCells++;
});

row.style.display=visibleCells?"":"none";
if(visibleCells) sectionMatches=true;
});

section.style.display=sectionMatches?"":"none";
if(sectionMatches) visibleSections++;
});

let empty=document.getElementById("emptyResults");

if(!empty){
empty=document.createElement("p");
empty.id="emptyResults";
empty.className="empty-results";
empty.textContent="لا توجد أوامر مطابقة لبحثك.";
content.prepend(empty);
}

empty.style.display=visibleSections?"none":"block";
}

document.getElementById("commandSearch").addEventListener("input",updateResults);

document.querySelectorAll(".filter-button").forEach(button=>{
button.addEventListener("click",()=>{
document.querySelectorAll(".filter-button").forEach(item=>item.classList.remove("active"));
button.classList.add("active");
activeFilter=button.dataset.filter;
updateResults();
});
});

document.addEventListener("click",async event=>{
const button=event.target.closest(".copy-button-new");
if(!button) return;

const command=button.closest(".command-cell-new").querySelector("code").innerText;

try{
await navigator.clipboard.writeText(command);
}catch{
const textarea=document.createElement("textarea");
textarea.value=command;
document.body.appendChild(textarea);
textarea.select();
document.execCommand("copy");
textarea.remove();
}

button.textContent="✓ تم النسخ";
setTimeout(()=>button.textContent="📋 نسخ",1400);
});
</script>
