<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | عرّاب الشبكات</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", sans-serif;
            background: #cbb77a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.96);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #111;
            font-size: 28px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #111;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: "Tajawal", sans-serif;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #cbb77a;
            box-shadow: 0 0 0 3px rgba(203,183,122,0.25);
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #111;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-family: "Tajawal", sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #111;
            text-decoration: none;
            font-weight: 700;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-weight: 600;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        .register-link a {
            color: #111;
            font-weight: 800;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">🌐</div>

        <h1>عرّاب الشبكات</h1>

        <p class="subtitle">تسجيل الدخول إلى حسابك</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                تسجيل الدخول
            </button>

        </form>

        <a href="reset-password.html" class="forgot-password">
            نسيت كلمة المرور؟
        </a>

        <div id="message" class="message"></div>

        <div class="register-link">
            ليس لديك حساب؟
            <a href="signup.html">إنشاء حساب</a>
        </div>

        <a href="index.html" class="home-link">
            العودة إلى الرئيسية
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.className = "message";
            message.textContent = "";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.className = "message error";
                message.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                return;
            }

            window.location.href = "profile.html";
        });
    </script>

</body>
</html>
