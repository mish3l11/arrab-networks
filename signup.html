<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | عرّاب الشبكات</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Tajawal", sans-serif;
            background: #cbb77a;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 430px;
            background: #111;
            color: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #cbb77a;
            color: #111;
            font-family: inherit;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 700;
            line-height: 1.8;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #bbb;
        }

        .login-link a {
            color: #cbb77a;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">🌐</div>

        <h1>إنشاء حساب</h1>

        <div class="subtitle">
            انضم إلى عرّاب الشبكات
        </div>

        <form id="signupForm">

            <label for="username">اسم المستخدم</label>

            <input
                type="text"
                id="username"
                placeholder="اكتب اسم المستخدم"
                maxlength="50"
                required
            >

            <label for="email">البريد الإلكتروني</label>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <label for="password">كلمة المرور</label>

            <input
                type="password"
                id="password"
                placeholder="كلمة المرور"
                minlength="6"
                required
            >

            <button type="submit" id="signupButton">
                إنشاء الحساب
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");
        const signupButton = document.getElementById("signupButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim().toLowerCase();

            const password =
                document.getElementById("password").value;

            if (!username || !email || !password) {
                message.textContent = "فضلاً أكمل جميع البيانات.";
                return;
            }

            if (password.length < 6) {
                message.textContent =
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";
                return;
            }

            signupButton.disabled = true;
            message.textContent = "جاري إنشاء الحساب...";

            try {

                const {
                    data,
                    error
                } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username
                        }
                    }
                });

                if (error) {
                    throw error;
                }

                if (!data.user) {
                    throw new Error("تعذر إنشاء الحساب.");
                }

                /*
                 * لا نضيف users هنا.
                 *
                 * Supabase Trigger يقوم بإنشاء صف users
                 * تلقائيًا عند إنشاء حساب Auth.
                 */

                if (data.session) {

                    message.textContent =
                        "تم إنشاء الحساب بنجاح. جاري تحويلك...";

                    setTimeout(() => {
                        window.location.href = "profile.html";
                    }, 1000);

                } else {

                    message.textContent =
                        "تم إنشاء الحساب بنجاح. تحقق من بريدك الإلكتروني لتفعيل الحساب.";

                    form.reset();
                }

            } catch (error) {

                console.error("Signup error:", error);

                message.textContent =
                    error.message ||
                    "حدث خطأ أثناء إنشاء الحساب.";

            } finally {

                signupButton.disabled = false;

            }

        });
    </script>

</body>
</html>
