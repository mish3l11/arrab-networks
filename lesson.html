.link-box {

color: #f4f4f4;

table {

.login-note {

.lesson-navigation {

.nav-card {

.nav-card:hover {

.nav-card small {

.nav-next {

.nav-prev {

@media (max-width: 550px) {

.progress-wrapper,

.content {
padding: 20px 15px;
}

.sidebar-links {
grid-template-columns: 1fr;
}

.lesson-navigation {
grid-template-columns: 1fr;
}

.nav-next,
.nav-prev {
text-align: center;
}
}
</style>

content: `

<section class="section">

<h2>ما هي الشبكة؟</h2>

<p>
الشبكة <strong>Network</strong> هي مجموعة من الأجهزة المتصلة مع بعضها
بهدف تبادل البيانات والموارد والخدمات.

الأجهزة قد تكون أجهزة كمبيوتر أو هواتف أو طابعات أو خوادم

<td>WLAN</td>

</section>


<section class="section">

<h2>Switch</h2>

<p>

<h2>ما هو IPv4؟</h2>

<p>
IPv4 هو نظام عنونة يستخدم 32-bit لتمثيل عناوين الأجهزة
على الشبكات.
</p>

<div class="code-box">192.168.1.10</div>

</p>

</section>


<section class="section">

<h2>Network وHost</h2>

<p>
عنوان IP يتكون منطقيًا من جزء يمثل الشبكة
وجزء يمثل الجهاز داخل الشبكة.
</p>

<div class="info-box">

</div>

</section>

</tr>

<tr>

</section>

<h2>نقاط يجب أن تتذكرها</h2>

</div>

</section>

<h2>مثال عملي</h2>

<p>
إذا كان جهاز PC متصلًا بالمنفذ GigabitEthernet0/0/1
وكان MAC الخاص به:
</p>

<div class="code-box">AA:BB:CC:DD:EE:FF</div>

<p>
يستطيع السويتش تعلم أن هذا الـMAC موجود خلف ذلك المنفذ.
</p>

</section>


<section class="section">

<h2>الفرق بين IP وMAC</h2>

<div class="table-wrapper">

<table>
<tr>
<th>IP Address</th>
<th>MAC Address</th>
</tr>

<tr>
<td>عنوان منطقي</td>
<td>عنوان لواجهة الشبكة</td>
</tr>

<tr>
<td>يستخدم في Layer 3</td>
<td>يستخدم في Layer 2</td>
</tr>

<tr>
<td>يمكن تغييره منطقيًا</td>
<td>مرتبط بواجهة الشبكة</td>
</tr>
</table>

</div>

</section>


<section class="section">

<h2>ربط بالمفاهيم السابقة</h2>

<div class="link-box">
في الدرس السابق تعلمنا أن الـSwitch يربط الأجهزة.
الآن أصبحنا نعرف كيف يستخدم السويتش MAC Address
لمعرفة مكان الأجهزة داخل الشبكة.
</div>

</section>

`
},

content: `

داخل الجهاز.
</p>

<p>
مثال: الجهاز الواحد قد يكون عليه Web Server وSSH Server

</tr>

<td>FTP</td>
</tr>

<tr>
<td>22</td>
<td>SSH</td>
</tr>

<tr>
<td>23</td>
<td>Telnet</td>
</tr>

<tr>
<td>25</td>
<td>SMTP</td>
</tr>

<tr>
<td>53</td>
<td>DNS</td>
</tr>

<tr>
<td>80</td>
<td>HTTP</td>
</tr>

<tr>
<td>443</td>
<td>HTTPS</td>
</tr>

</table>

</div>

</section>


<section class="section">

<h2>TCP وUDP</h2>

id: 6,
path: 1,
title: "OSI Model",
level: "مبتدئ",
description: "تعرف على طبقات OSI السبع وكيف تساعدك في فهم الشبكات واستكشاف الأخطاء.",
content: `

<section class="section">

<h2>ما هو OSI Model؟</h2>

<p>
OSI Model هو نموذج مرجعي يقسم عملية الاتصال الشبكي
إلى سبع طبقات.
</p>

</section>


<section class="section">

<h2>الطبقات السبع</h2>

<div class="table-wrapper">

<table>

<tr>
<th>Layer</th>
<th>الاسم</th>
<th>مثال</th>
</tr>

<tr>
<td>7</td>
<td>Application</td>
<td>HTTP / DNS / SSH</td>
</tr>

<tr>
<td>6</td>
<td>Presentation</td>
<td>Data Formatting</td>
</tr>

<tr>
<td>5</td>
<td>Session</td>
<td>Sessions</td>
</tr>

<tr>
<td>4</td>
<td>Transport</td>
<td>TCP / UDP</td>
</tr>

<tr>
<td>3</td>
<td>Network</td>
<td>IP / Routing</td>
</tr>

<tr>
<td>2</td>
<td>Data Link</td>
<td>MAC / Ethernet</td>
</tr>

<tr>
<td>1</td>
<td>Physical</td>
<td>Cable / Signal</td>
</tr>

</table>

</div>

</section>


<section class="section">

<h2>لماذا نحتاج OSI؟</h2>

<p>
يساعدك النموذج في تقسيم المشكلة إلى أجزاء.
مثلًا إذا كان الكابل غير متصل فابدأ بالتفكير في Layer 1،
وإذا كانت المشكلة مرتبطة بالـIP والRouting فغالبًا ستنظر إلى Layer 3.
</p>

</section>


<section class="section">

<h2>ربط بالمفاهيم السابقة</h2>

<div class="link-box">
تعلمنا MAC في Layer 2 وIP في Layer 3،
والآن أصبح بإمكانك وضع هذه المفاهيم داخل نموذج OSI.
</div>

</section>


<section class="section">

<h2>نقاط يجب أن تتذكرها</h2>

<div class="remember-box">
<ul>
<li>MAC يرتبط غالبًا بـLayer 2.</li>
<li>IP يرتبط بـLayer 3.</li>
<li>TCP وUDP في Layer 4.</li>
<li>الكابل والإشارة في Layer 1.</li>
</ul>
</div>

</section>

`
},

id: 8,
path: 1,
title: "Hub vs Switch vs Router",
level: "مبتدئ",
description: "افهم الفرق بين Hub وSwitch وRouter ومتى يستخدم كل جهاز.",
content: `

<section class="section">

<h2>Hub</h2>

<p>
الـHub جهاز بسيط يعمل على المستوى الفيزيائي ويرسل الإشارة
إلى المنافذ الأخرى بدلًا من اتخاذ قرار ذكي بناءً على MAC Address.
</p>

</section>


<section class="section">

<h2>Switch</h2>

<p>
الـSwitch يستطيع تعلم MAC Address Table
واتخاذ قرار بشأن المنفذ الذي يرسل إليه Frame داخل الشبكة المحلية.
</p>

</section>


<section class="section">

<h2>Router</h2>

<p>
الـRouter يربط شبكات مختلفة ويستخدم IP Address وRouting Table
لاختيار المسار.
</p>

</section>


<section class="section">

<h2>المقارنة</h2>

<div class="table-wrapper">

<table>

<tr>
<th>الجهاز</th>
<th>الفكرة الأساسية</th>
<th>المستوى التقريبي</th>
</tr>

<tr>
<td>Hub</td>
<td>إرسال الإشارة للمنافذ</td>
<td>Layer 1</td>
</tr>

<tr>
<td>Switch</td>
<td>Forwarding باستخدام MAC</td>
<td>Layer 2</td>
</tr>

<tr>
<td>Router</td>
<td>Routing باستخدام IP</td>
<td>Layer 3</td>
</tr>

</table>

</div>

</section>


<section class="section">

<h2>نقاط يجب أن تتذكرها</h2>

<div class="remember-box">
Hub = يكرر الإشارة،
Switch = يتعامل مع MAC داخل الشبكة المحلية،
Router = يربط الشبكات باستخدام IP.
</div>

</section>

`
},

description: "تعلم تقسيم الشبكات إلى Subnets وفهم CIDR وعدد العناوين والأجهزة.",
content: `

<section class="section">

<h2>ما هو Subnetting؟</h2>

<p>
Subnetting هو تقسيم شبكة أكبر إلى شبكات أصغر
بهدف تنظيم العناوين وتقليل نطاق Broadcast وتحسين إدارة الشبكة.
</p>

</section>


<section class="section">

<h2>/24</h2>

<p>
الشبكة 192.168.1.0/24 تحتوي على 256 عنوانًا إجمالًا.
في الاستخدام التقليدي للشبكات، يوجد عادةً 254 عنوانًا قابلًا للاستخدام للأجهزة.
</p>

<div class="code-box">Network: 192.168.1.0
First Host: 192.168.1.1
Last Host: 192.168.1.254
Broadcast: 192.168.1.255</div>

</section>


<section class="section">

<h2>/30</h2>

<p>
/30 يحتوي على 4 عناوين إجمالًا،
ويُستخدم تقليديًا في بعض وصلات Point-to-Point.
</p>

<div class="code-box">Network
Host
Host
Broadcast</div>

</section>


<section class="section">

<h2>لماذا نستخدم Subnetting؟</h2>

<ul>
<li>تنظيم الشبكة.</li>
<li>تقليل Broadcast Domain.</li>
<li>استغلال العناوين بشكل أفضل.</li>
<li>فصل الأقسام والشبكات.</li>
</ul>

</section>


<section class="section">

<h2>ربط بالمفاهيم السابقة</h2>

<div class="link-box">
تعلمنا IPv4 في المسار الأول.
الآن نستخدم فهمنا للـIP والـSubnet Mask لتقسيم الشبكات.
</div>

</section>

`
},

title: "Switching",
level: "متوسط",
description: "تعرف على طريقة عمل Switching وMAC Address Table وBroadcast داخل الشبكة.",
content: `

<section class="section">

<h2>ما هو Switching؟</h2>

<p>
Switching هو عملية تمرير Frames داخل الشبكة المحلية
اعتمادًا على معلومات مثل MAC Address.
</p>

</section>


<section class="section">

<h2>MAC Address Table</h2>

<p>
السويتش يتعلم Source MAC من الإطارات التي يستقبلها
ويربط العنوان بالمنفذ الذي جاء منه.
</p>

<div class="code-box">Cisco:
show mac address-table

Huawei:
display mac-address</div>

</section>


<section class="section">

<h2>Unknown Unicast</h2>

<p>
إذا لم يعرف السويتش المنفذ الخاص بالـDestination MAC،
فقد يقوم بعمل Flooding داخل الـVLAN حسب الحالة.
</p>

</section>


<section class="section">

<h2>Broadcast</h2>

<p>
Broadcast Frame يتم التعامل معه داخل نطاق الـBroadcast Domain،
والـVLAN تساعد على فصل هذه النطاقات.
</p>

</section>


<section class="section">

<h2>مثال عملي</h2>

<div class="code-box">PC1 ----\
Switch ---- PC3
PC2 ----/</div>

<p>
السويتش يتعلم MAC للأجهزة المتصلة به
ثم يستخدم الجدول لاتخاذ قرار Forwarding.
</p>

</section>

`
},

id: 11,

title: "VLAN",
level: "متوسط",
description: "تعلم VLAN وAccess Port وTrunk وكيفية فصل الشبكات منطقيًا.",
content: `

<section class="section">

<h2>ما هي VLAN؟</h2>

<p>
VLAN هي Virtual Local Area Network،
وتستخدم لتقسيم الشبكة منطقيًا إلى شبكات منفصلة.
</p>

</section>


<section class="section">

<h2>Access Port</h2>

<p>
الـAccess Port يستخدم عادةً لتوصيل جهاز نهائي
داخل VLAN محددة.
</p>

<div class="code-box">Cisco:

interface GigabitEthernet0/1
switchport mode access
switchport access vlan 10</div>

</section>


<section class="section">

<h2>Trunk</h2>

<p>
الـTrunk يسمح بمرور أكثر من VLAN بين الأجهزة التي تدعم هذا النوع
من الربط، مثل Switch إلى Switch.
</p>

<div class="code-box">Cisco:

interface GigabitEthernet0/24
switchport mode trunk
switchport trunk allowed vlan 10,20</div>

<div class="code-box">Huawei:

interface GigabitEthernet0/0/24
port link-type trunk
port trunk allow-pass vlan 10 20</div>

</section>


<section class="section">

<h2>مثال</h2>

<div class="code-box">VLAN 10 → Users
VLAN 20 → Cameras
VLAN 30 → Servers</div>

<p>
بهذه الطريقة يمكن فصل أنواع الأجهزة منطقيًا
حتى لو كانت متصلة بالبنية التحتية نفسها.
</p>

</section>


<section class="section">

<h2>نقطة مهمة</h2>

<div class="warning-box">
وجود VLAN في سويتش واحد لا يعني تلقائيًا أن VLAN ستعمل بين سويتشين.
يجب أن يكون الربط بين السويتشات معدًا بطريقة تسمح بمرور الـVLAN المطلوبة.
</div>

</section>

`
},

description: "تعرف على Routing وRouting Table وكيف يقرر الراوتر مسار الحزم.",
content: `

|
Router

<h2>ربط بالمفاهيم السابقة</h2>

{
id: 14,
path: 3,
title: "OSPF",
level: "متقدم",
description: "تعرف على OSPF وكيفية استخدام بروتوكول Dynamic Routing لتبادل معلومات الشبكات.",
content: `

<section class="section">

<h2>ما هو OSPF؟</h2>

<p>
OSPF هو بروتوكول Dynamic Routing يستخدم لتبادل معلومات الشبكات
بين أجهزة الراوتر.
</p>

</section>


<section class="section">

<h2>OSPF Neighbor</h2>

<p>
أجهزة OSPF يمكن أن تنشئ علاقة Neighbor
لتبادل معلومات الـRouting.
</p>

</section>


<section class="section">

<h2>Cisco - مثال</h2>

<div class="code-box">router ospf 1
network 10.0.0.0 0.0.0.255 area 0</div>

</section>


<section class="section">

<h2>Huawei - مثال</h2>

<div class="code-box">ospf 1
area 0
network 10.0.0.0 0.0.0.255</div>

<div class="warning-box">
صيغة الأوامر قد تختلف حسب إصدار VRP وطراز جهاز Huawei،

</div>

</section>


<section class="section">

<h2>التحقق</h2>

<div class="code-box">Cisco:
show ip ospf neighbor

Huawei:
display ospf peer</div>

</section>


<section class="section">

<h2>نقاط يجب أن تتذكرها</h2>

<div class="remember-box">
OSPF Dynamic Routing Protocol،
ويختلف عن Static Routing لأن المسارات يتم تبادلها

</div>

</section>

`

title: "SSH وإدارة الأجهزة",
level: "متوسط",
description: "تعرف على SSH وكيفية الإدارة الآمنة لأجهزة الشبكات عن بُعد.",
content: `

<section class="section">

<h2>ما هو SSH؟</h2>

<p>
SSH اختصار لـSecure Shell،
ويستخدم للوصول إلى أجهزة الشبكة عن بُعد بطريقة مشفرة.
</p>

/* =====================================================
المتغيرات
===================================================== */

const params = new URLSearchParams(window.location.search);

const lessonId = Number(params.get("id")) || 1;

const currentLesson = lessons.find(
lesson => lesson.id === lessonId
);


const path = currentLesson
? paths.find(p => p.id === currentLesson.path)
: null;


const pathLessons = path
? path.lessons
.map(id => lessons.find(lesson => lesson.id === id))
.filter(Boolean)
: [];


/* =====================================================
عناصر الصفحة
===================================================== */

const lessonTitle =
document.getElementById("lessonTitle");

const lessonDescription =
document.getElementById("lessonDescription");

const lessonNumber =
document.getElementById("lessonNumber");

const lessonLevel =
document.getElementById("lessonLevel");

const lessonCount =
document.getElementById("lessonCount");

const pathLabel =
document.getElementById("pathLabel");

const lessonContent =
document.getElementById("lessonContent");

const sidebarLinks =
document.getElementById("sidebarLinks");

const lessonNavigation =
document.getElementById("lessonNavigation");

const completeBtn =
document.getElementById("completeBtn");

const completionText =
document.getElementById("completionText");

const loginNote =
document.getElementById("loginNote");

const progressText =
document.getElementById("progressText");

const overallText =
document.getElementById("overallText");

const progressBar =
document.getElementById("progressBar");


/* =====================================================
التحقق من وجود الدرس
===================================================== */

if (!currentLesson || !path) {

lessonTitle.textContent = "الدرس غير موجود";

lessonDescription.textContent =
"تعذر العثور على الدرس المطلوب.";

lessonContent.innerHTML = `
<div class="warning-box">
رقم الدرس غير صحيح.
</div>
`;

completeBtn.style.display = "none";

} else {

renderLesson();

}


/* =====================================================
عرض الدرس
===================================================== */

function renderLesson() {

document.title =
`${currentLesson.title} | عرّاب الشبكات`;


pathLabel.textContent =
`${path.icon} المسار ${path.id} — ${path.name}`;


lessonTitle.textContent =
currentLesson.title;


lessonDescription.textContent =
currentLesson.description;


lessonNumber.textContent =
`الدرس ${currentLesson.id}`;


lessonLevel.textContent =
`المستوى: ${currentLesson.level}`;


const index =
pathLessons.findIndex(
lesson => lesson.id === currentLesson.id
);


lessonCount.textContent =
`الدرس ${index + 1} من ${pathLessons.length}`;


lessonContent.innerHTML =
currentLesson.content;


renderSidebar();

renderNavigation();

loadProgress();

}


/* =====================================================
Sidebar
===================================================== */

function renderSidebar() {

sidebarLinks.innerHTML = "";

pathLessons.forEach(lesson => {

const link =
document.createElement("a");

link.href =
`lesson.html?id=${lesson.id}`;

link.textContent =
`${lesson.id}. ${lesson.title}`;


if (lesson.id === currentLesson.id) {

link.classList.add("active");

}


sidebarLinks.appendChild(link);

});

}


/* =====================================================
Navigation
===================================================== */

function renderNavigation() {

const index =
pathLessons.findIndex(
lesson => lesson.id === currentLesson.id
);


const previous =
index > 0
? pathLessons[index - 1]
: null;


const next =
index < pathLessons.length - 1
? pathLessons[index + 1]
: null;


lessonNavigation.innerHTML = "";


if (previous) {

const previousLink =
document.createElement("a");

previousLink.className =
"nav-card nav-prev";

previousLink.href =
`lesson.html?id=${previous.id}`;

previousLink.innerHTML = `
<small>← الدرس السابق</small>
<strong>${previous.title}</strong>
`;

lessonNavigation.appendChild(previousLink);

} else {

const empty =
document.createElement("div");

lessonNavigation.appendChild(empty);

}


if (next) {

const nextLink =
document.createElement("a");

nextLink.className =
"nav-card nav-next";

nextLink.href =
`lesson.html?id=${next.id}`;

nextLink.innerHTML = `
<small>الدرس التالي →</small>
<strong>${next.title}</strong>
`;

lessonNavigation.appendChild(nextLink);

}

}


/* =====================================================
Supabase
===================================================== */

let completedLessons = [];


async function getCurrentUser() {

try {

if (
typeof supabaseClient === "undefined" ||
!supabaseClient
) {
return null;
}


const {
data,
error
} =
await supabaseClient.auth.getUser();


if (error) {

console.error(error);

return null;

}


return data?.user || null;

} catch (error) {

console.error(error);

return null;

}

}


/* =====================================================
تحميل التقدم
===================================================== */

async function loadProgress() {

const user =
await getCurrentUser();


if (!user) {

updateProgress([]);

loginNote.textContent =
"سجل الدخول حتى يتم حفظ إنجاز الدرس.";

return;

}


loginNote.textContent = "";


try {

const {
data,
error
} =
await supabaseClient
.from("users")
.select("completed_lessons")
.eq("auth_id", user.id)
.maybeSingle();


if (error) {

console.error(error);

updateProgress([]);

return;

}


completedLessons =
Array.isArray(data?.completed_lessons)
? data.completed_lessons
.map(Number)
.filter(Number.isFinite)
: [];


completedLessons =
[...new Set(completedLessons)];


updateProgress(completedLessons);


if (
completedLessons.includes(currentLesson.id)
) {

setCompletedButton();

}

} catch (error) {

console.error(error);

}

}


/* =====================================================
تحديث التقدم
===================================================== */

function updateProgress(completed) {

const pathCompleted =
pathLessons.filter(
lesson =>
completed.includes(lesson.id)
).length;


const pathPercent =
pathLessons.length
? Math.round(
(pathCompleted / pathLessons.length) * 100
)
: 0;


const overallPercent =
lessons.length
? Math.round(
(completed.filter(
id =>
lessons.some(
lesson =>
lesson.id === id
)
).length / lessons.length) * 100
)
: 0;


progressText.textContent =
`تقدم المسار: ${pathPercent}%`;


overallText.textContent =
`التقدم العام: ${overallPercent}%`;


progressBar.style.width =
`${pathPercent}%`;

}


/* =====================================================
إكمال الدرس
===================================================== */

completeBtn.addEventListener(
"click",
async () => {

const user =
await getCurrentUser();


if (!user) {

loginNote.textContent =
"يجب تسجيل الدخول لحفظ إنجاز الدرس.";

return;

}


if (
completedLessons.includes(
currentLesson.id
)
) {

return;

}


completeBtn.disabled = true;

completeBtn.textContent =
"جاري الحفظ...";


try {

const updated =
[
...new Set([
...completedLessons,
currentLesson.id
])
]
.filter(Number.isFinite)
.sort((a, b) => a - b);


const {
error
} =
await supabaseClient
.from("users")
.update({
completed_lessons: updated
})
.eq("auth_id", user.id);


if (error) {

console.error(error);

completeBtn.disabled = false;

completeBtn.textContent =
"✓ إكمال الدرس";

completionText.textContent =
"حدث خطأ أثناء حفظ الإنجاز.";

return;

}


completedLessons =
updated;


updateProgress(
completedLessons
);


setCompletedButton();


completionText.textContent =
"🎉 تم حفظ إنجاز الدرس وتحديث تقدم المسار.";


/*
الانتقال للدرس التالي لا يتم تلقائيًا،
حتى يكون لدى الطالب وقت لقراءة رسالة الإنجاز.
*/

} catch (error) {

console.error(error);

completeBtn.disabled = false;

completeBtn.textContent =
"✓ إكمال الدرس";

}

}
);


/* =====================================================
زر مكتمل
===================================================== */

function setCompletedButton() {

completeBtn.classList.add(
"completed"
);

completeBtn.textContent =
"✓ تم إكمال الدرس";

completeBtn.disabled = true;

completionText.textContent =
"تم تسجيل إنجازك في هذا الدرس.";

}


/* =====================================================
Scroll Sidebar
===================================================== */

window.addEventListener(
"load",
() => {

const active =
document.querySelector(
".sidebar a.active"
);


if (active) {

active.scrollIntoView({
block: "nearest"
});

}

}
);

</script>
