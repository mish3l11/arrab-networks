/* =========================
LOAD PROGRESS
========================= */

async function loadCompletedLessons() {

try {

const {
data: {
user
},
error: userError
} =
await supabaseClient.auth.getUser();


if (userError) {

throw userError;

}


/* =========================
NOT LOGGED IN
========================= */

if (!user) {

completionMessage.textContent =
"سجّل الدخول أولًا لحفظ تقدمك";

return;

}


/* =========================
GET USER PROFILE
========================= */

const {
data,
error
} =
await supabaseClient

.from("users")

.select(
"completed_lessons"
)

.eq(
"auth_id",
user.id
)

.maybeSingle();


if (error) {

throw error;

}


if (!data) {

completionMessage.textContent =
"لم يتم العثور على ملف المستخدم";

return;

}


/* =========================
READ COMPLETED LESSONS
========================= */

if (
Array.isArray(
data.completed_lessons
)
) {

completedLessons =
data.completed_lessons.map(
function(id) {

return Number(id);

}
);

}

else {

completedLessons = [];

}


updateCompletionButton();

}

catch (error) {

console.error(
"خطأ في تحميل تقدم الدرس:",
error
);

completionMessage.textContent =
"تعذر تحميل تقدمك حاليًا";

}

}


/* =========================
SAVE COMPLETION
========================= */

completeLessonButton.addEventListener(
"click",
async function() {

try {

completeLessonButton.disabled =
true;


completionMessage.textContent =
"جاري حفظ تقدمك...";


/* =========================
CHECK LOGIN
========================= */

const {
data: {
user
},
error: userError
} =
await supabaseClient.auth.getUser();


if (userError) {

throw userError;

}


if (!user) {

completionMessage.textContent =
"سجّل الدخول أولًا لحفظ تقدمك";

return;

}


const currentLessonId =
Number(lessonId);


/* =========================
ADD LESSON
========================= */

if (
!completedLessons.includes(
currentLessonId
)
) {

completedLessons.push(
currentLessonId
);

}


/* =========================
SORT
========================= */

completedLessons.sort(
function(a, b) {

return a - b;

}
);


/* =========================
REMOVE DUPLICATES
========================= */

completedLessons =
[
...new Set(
completedLessons
)
];


/* =========================
UPDATE SUPABASE
========================= */

const {
error
} =
await supabaseClient

.from("users")

.update({

completed_lessons:
completedLessons

})

.eq(
"auth_id",
user.id
);


if (error) {

throw error;

}


/* =========================
UPDATE UI
========================= */

updateCompletionButton();

completionMessage.textContent =
"تم حفظ تقدمك في هذا الدرس ✓";

}

catch (error) {

console.error(
"خطأ في حفظ تقدم الدرس:",
error
);

completionMessage.textContent =
"حدث خطأ أثناء حفظ التقدم";

}

finally {

completeLessonButton.disabled =
false;

}

}
);
