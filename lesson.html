<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: "Tajawal", sans-serif;
background: #cbb77a;
color: #111111;
}

/* =========================
HEADER
========================= */

header {
background: #bda766;
padding: 18px 6%;
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
border-bottom: 1px solid rgba(0,0,0,0.08);
}

.brand {
display: flex;
align-items: center;
gap: 10px;
text-decoration: none;
color: #111111;
}

.brand-icon {
width: 45px;
height: 45px;
display: flex;
align-items: center;
justify-content: center;
background: #111111;
color: #d6c58f;
border-radius: 12px;
overflow: hidden;
flex-shrink: 0;
}

.network-logo-svg {
width: 100%;
height: 100%;
display: block;
}

.brand-name {
font-size: 22px;
font-weight: 800;
line-height: 1.2;
}

.brand-subtitle {
font-family: Arial, sans-serif;
font-size: 10px;
font-weight: 700;
letter-spacing: 2px;
opacity: 0.65;
}

nav {
display: flex;
gap: 22px;
align-items: center;
flex-wrap: wrap;
}

nav a {
color: #111111;
text-decoration: none;
font-weight: 700;
transition: 0.2s;
}

nav a:hover {
color: #075985;
}

/* =========================
PAGE
========================= */

.lesson-page {
width: min(1200px, 92%);
margin: 45px auto 80px;
}

.back-link {
display: inline-block;
color: #111111;
text-decoration: none;
font-weight: 700;
margin-bottom: 20px;
}

.back-link:hover {
color: #075985;
}

/* =========================
HERO
========================= */

.lesson-hero {
background: #111111;
color: #ffffff;
border-radius: 24px;
padding: 40px;
margin-bottom: 28px;
}

.lesson-badges {
display: flex;
gap: 10px;
flex-wrap: wrap;
margin-bottom: 20px;
}

.badge {
padding: 8px 14px;
border-radius: 30px;
background: rgba(255,255,255,0.1);
font-size: 13px;
font-weight: 700;
}

.lesson-hero h1 {
margin: 0 0 12px;
font-size: clamp(30px, 5vw, 48px);
}

.lesson-description {
margin: 0;
color: #d6d6d6;
line-height: 1.9;
font-size: 17px;
}

.progress-area {
margin-top: 30px;
}

.progress-info {
display: flex;
justify-content: space-between;
margin-bottom: 10px;
font-weight: 700;
font-size: 14px;
}

.progress-bar {
height: 10px;
background: #333333;
border-radius: 20px;
overflow: hidden;
}

.progress-fill {
height: 100%;
background: #075985;
border-radius: 20px;
transition: width 0.4s ease;
}

/* =========================
LESSON LAYOUT
========================= */

.lesson-layout {
display: grid;
grid-template-columns: 260px 1fr;
gap: 25px;
align-items: start;
}

.lesson-sidebar {
background: #d6c58f;
border-radius: 20px;
padding: 22px;
position: sticky;
top: 20px;
}

.lesson-sidebar h3 {
margin-top: 0;
margin-bottom: 15px;
}

.lesson-sidebar a {
display: block;
text-decoration: none;
color: #111111;
padding: 11px 12px;
border-radius: 10px;
margin-bottom: 6px;
font-weight: 500;
transition: 0.2s;
}

.lesson-sidebar a:hover {
background: rgba(7,89,133,0.12);
}

.lesson-sidebar a.active {
background: #111111;
color: #ffffff;
}

/* =========================
ARTICLE
========================= */

.lesson-article {
background: #d6c58f;
border-radius: 20px;
padding: 35px;
}

.lesson-article section {
margin-bottom: 48px;
scroll-margin-top: 30px;
}

.lesson-article section:last-child {
margin-bottom: 0;
}

.lesson-article h3 {
font-size: 25px;
margin: 0 0 15px;
}

.lesson-article h4 {
font-size: 21px;
margin-top: 25px;
margin-bottom: 12px;
}

.lesson-article p {
line-height: 2;
font-size: 16px;
}

.lesson-article ul {
line-height: 2;
padding-right: 25px;
}

.lesson-article li {
margin-bottom: 7px;
}

/* =========================
INFO BOXES
========================= */

.info-box,
.gold-box,
.warning-box,
.practice-box {
padding: 18px 20px;
border-radius: 12px;
margin: 20px 0;
}

.info-box {
background: rgba(7,89,133,0.10);
border-right: 5px solid #075985;
}

.gold-box {
background: rgba(214,197,143,0.45);
border-right: 5px solid #111111;
}

.warning-box {
background: rgba(180,70,60,0.10);
border-right: 5px solid #9c4038;
}

.practice-box {
background: rgba(47,111,69,0.10);
border-right: 5px solid #2f6f45;
}

.info-box strong,
.gold-box strong,
.warning-box strong,
.practice-box strong {
display: block;
margin-bottom: 8px;
font-size: 17px;
}

.info-box p,
.gold-box p,
.warning-box p,
.practice-box p {
margin: 5px 0;
}

/* =========================
CODE
========================= */

.code-box {
background: #111111;
color: #eeeeee;
border-radius: 15px;
padding: 20px;
margin: 20px 0;
overflow-x: auto;
}

.code-title {
color: #d6c58f;
font-size: 13px;
margin-bottom: 12px;
font-weight: 700;
}

pre {
margin: 0;
font-family: Consolas, monospace;
line-height: 1.8;
white-space: pre-wrap;
}

code {
font-family: Consolas, monospace;
}

/* =========================
COMPARISON
========================= */

.comparison {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
margin: 20px 0;
}

.comparison-card {
background: rgba(255,255,255,0.25);
border: 1px solid rgba(0,0,0,0.08);
border-radius: 14px;
padding: 20px;
}

.comparison-card h4 {
margin-top: 0;
}

/* =========================
COMPLETE LESSON
========================= */

.lesson-complete {
background: #d6c58f;
border-radius: 20px;
padding: 25px;
margin-top: 25px;
text-align: center;
}

#completeLessonButton {
border: 0;
background: #075985;
color: #ffffff;
padding: 15px 28px;
border-radius: 12px;
font-family: inherit;
font-size: 16px;
font-weight: 700;
cursor: pointer;
transition: 0.2s;
}

#completeLessonButton:hover {
transform: translateY(-2px);
}

#completeLessonButton.completed {
background: #2f6f45;
}

#completionMessage {
margin-top: 12px;
font-size: 14px;
font-weight: 700;
opacity: 0.7;
}

/* =========================
NAVIGATION
========================= */

.lesson-navigation {
margin-top: 25px;
display: flex;
justify-content: space-between;
gap: 15px;
}

.lesson-navigation a {
text-decoration: none;
background: #111111;
color: #ffffff;
padding: 15px 22px;
border-radius: 12px;
font-weight: 700;
transition: 0.2s;
}

.lesson-navigation a:hover {
background: #075985;
}

/* =========================
FOOTER
========================= */

footer {
background: #111111;
color: #ffffff;
text-align: center;
padding: 30px;
margin-top: 70px;
}

.footer-brand {
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
}

.footer-logo {
width: 55px;
height: 55px;
display: flex;
align-items: center;
justify-content: center;
background: #d6c58f;
color: #111111;
border-radius: 14px;
overflow: hidden;
}

.footer-logo .network-logo-svg {
width: 100%;
height: 100%;
}

footer strong {
font-size: 18px;
}

footer p {
margin: 8px 0 0;
color: #bbbbbb;
}

/* =========================
MOBILE
========================= */

@media (max-width: 800px) {

header {
flex-direction: column;
align-items: flex-start;
}

nav {
width: 100%;
justify-content: space-between;
gap: 10px;
}

.lesson-layout {
grid-template-columns: 1fr;
}

.lesson-sidebar {
position: static;
}

.lesson-hero {
padding: 28px 22px;
}

.lesson-article {
padding: 25px 20px;
}

.lesson-navigation {
flex-direction: column;
}

.lesson-navigation a {
text-align: center;
}

.lesson-page {
width: 94%;
margin-top: 30px;
}

.comparison {
grid-template-columns: 1fr;
}
}
</style>

Router 🟠

Internet 🌍

/* =========================================================
تشغيل الدرس الحالي
========================================================= */

const params = new URLSearchParams(window.location.search);

let lessonId = parseInt(params.get("id")) || 1;

if (
!Number.isInteger(lessonId) ||
lessonId < 1 ||
lessonId > lessons.length
) {
lessonId = 1;
}

const lesson = lessons.find(function(item) {
return item.id === lessonId;
});


/* =========================================================
عناصر الصفحة
========================================================= */

const lessonCategory =
document.getElementById("lessonCategory");

const lessonLevel =
document.getElementById("lessonLevel");

const lessonTitle =
document.getElementById("lessonTitle");

const lessonDescription =
document.getElementById("lessonDescription");

const lessonProgressText =
document.getElementById("lessonProgressText");

const lessonProgressPercent =
document.getElementById("lessonProgressPercent");

const lessonProgressFill =
document.getElementById("lessonProgressFill");

const lessonSidebar =
document.getElementById("lessonSidebar");

const lessonContent =
document.getElementById("lessonContent");

const completeLessonButton =
document.getElementById("completeLessonButton");

const completionMessage =
document.getElementById("completionMessage");

const previousLesson =
document.getElementById("previousLesson");

const nextLesson =
document.getElementById("nextLesson");


/* =========================================================
بيانات الدرس
========================================================= */

lessonCategory.textContent = lesson.category;

lessonLevel.textContent = lesson.level;

lessonTitle.textContent = lesson.title;

lessonDescription.textContent = lesson.description;


/* =========================================================
نسبة التقدم
========================================================= */

const progress =
(lessonId / lessons.length) * 100;

lessonProgressText.textContent =
"الدرس " +
lessonId +
" من " +
lessons.length;

lessonProgressPercent.textContent =
Math.round(progress) + "%";

lessonProgressFill.style.width =
progress + "%";


/* =========================================================
بناء القائمة والمحتوى
========================================================= */

lesson.sections.forEach(function(section, index) {

const sectionId =
"section-" + index;

const link =
document.createElement("a");

link.href =
"#" + sectionId;

link.textContent =
String(index + 1).padStart(2, "0") +
" — " +
section.title;

lessonSidebar.appendChild(link);


const sectionElement =
document.createElement("section");

sectionElement.id =
sectionId;

sectionElement.innerHTML = `
<h3>
${String(index + 1).padStart(2, "0")} —
${section.title}
</h3>

${section.content}
`;

lessonContent.appendChild(sectionElement);

});


/* =========================================================
التنقل بين الدروس
========================================================= */

if (lessonId > 1) {

previousLesson.href =
"lesson.html?id=" + (lessonId - 1);

previousLesson.textContent =
"← الدرس السابق";

} else {

previousLesson.href =
"lessons.html";

previousLesson.textContent =
"← قائمة الدروس";

}


if (lessonId < lessons.length) {

nextLesson.href =
"lesson.html?id=" + (lessonId + 1);

nextLesson.textContent =
"الدرس التالي →";

} else {

nextLesson.href =
"quiz.html";

nextLesson.textContent =
"اذهب للاختبار →";

}


/* =========================================================
حفظ الدروس المكتملة
========================================================= */

function getCompletedLessons() {

try {

const saved =
JSON.parse(
localStorage.getItem("completedLessons") || "[]"
);

if (Array.isArray(saved)) {
return saved;
}

return [];

} catch (error) {

return [];

}

}


/* =========================================================
تحديث زر الإكمال
========================================================= */

function updateCompletionButton() {

const completedLessons =
getCompletedLessons();

if (completedLessons.includes(lessonId)) {

completeLessonButton.textContent =
"✓ تم إكمال الدرس";

completeLessonButton.classList.add(
"completed"
);

completionMessage.textContent =
"تم حفظ تقدمك في هذا الدرس ✓";

} else {

completeLessonButton.textContent =
"✓ تم إكمال الدرس";

completeLessonButton.classList.remove(
"completed"
);

completionMessage.textContent =
"لم يتم إكمال هذا الدرس بعد";

}

}


/* =========================================================
زر إكمال الدرس
========================================================= */

completeLessonButton.addEventListener(
"click",
function() {

let completedLessons =
getCompletedLessons();

if (!completedLessons.includes(lessonId)) {

completedLessons.push(lessonId);

completedLessons.sort(
function(a, b) {
return a - b;
}
);

localStorage.setItem(
"completedLessons",
JSON.stringify(completedLessons)
);

}

updateCompletionButton();

}
);


/* =========================================================
القائمة الجانبية Smooth Scroll
========================================================= */

document
.querySelectorAll(".lesson-sidebar a")
.forEach(function(link) {

link.addEventListener(
"click",
function(event) {

const targetId =
link.getAttribute("href");

const target =
document.querySelector(targetId);

if (target) {

event.preventDefault();

target.scrollIntoView({
behavior: "smooth",
block: "start"
});

}

}
);

});


/* =========================================================
تشغيل حالة الإكمال
========================================================= */

updateCompletionButton();

</script>
