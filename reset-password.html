<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>استعادة كلمة المرور | عرّاب الشبكات</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Tajawal", sans-serif;
            background: #cbb77a;
            color: #111;
        }

        .box {
            width: 100%;
            max-width: 430px;

            background: #111;
            color: white;

            padding: 35px;
            border-radius: 25px;

            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 28px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;

            border: none;
            border-radius: 12px;

            font-family: inherit;
            font-size: 16px;

            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: #cbb77a;
            color: #111;

            font-family: inherit;
            font-size: 17px;
            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;

            border-radius: 10px;

            text-align: center;
            font-weight: 700;

            display: none;
        }

        .success {
            display: block !important;
            background: #166534;
            color: white;
        }

        .error {
            display: block !important;
            background: #b91c1c;
            color: white;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #bbb;
        }

        .login-link a {
            color: #cbb77a;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">🌐</div>

        <h1>استعادة كلمة المرور</h1>

        <div class="subtitle">
            أدخل بريدك الإلكتروني وسنرسل لك رابطًا لتغيير كلمة المرور.
        </div>

        <form id="resetForm">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <button type="submit" id="resetButton">
                إرسال رابط الاستعادة
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            تذكرت كلمة المرور؟
            <a href="login.html">تسجيل الدخول</a>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>

        const resetForm =
            document.getElementById("resetForm");

        const emailInput =
            document.getElementById("email");

        const resetButton =
            document.getElementById("resetButton");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {

            message.textContent = text;
            message.className = type;

        }


        resetForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    emailInput.value.trim();

                if (!email) {

                    showMessage(
                        "اكتب البريد الإلكتروني أولاً.",
                        "error"
                    );

                    return;
                }


                resetButton.disabled = true;

                resetButton.textContent =
                    "جاري الإرسال...";


                try {

                    const { error } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        "https://arrabnet.com/update-password.html"
                                }
                            );


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني.",
                        "success"
                    );


                    resetForm.reset();


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "تعذر إرسال رابط الاستعادة. حاول مرة أخرى.",
                        "error"
                    );

                } finally {

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "إرسال رابط الاستعادة";

                }

            }
        );

    </script>

</body>
</html>
