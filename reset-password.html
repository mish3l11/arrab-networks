<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>استعادة كلمة المرور | عرّاب الشبكات</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", sans-serif;
            background: #cbb77a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        }

        .logo {
            text-align: center;
            font-size: 48px;
        }

        h1 {
            text-align: center;
            color: #111;
            margin: 8px 0;
            font-size: 27px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: "Tajawal", sans-serif;
            font-size: 16px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #cbb77a;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-family: "Tajawal", sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">🔐</div>

        <h1>استعادة كلمة المرور</h1>

        <p class="subtitle">
            أدخل بريدك الإلكتروني لإرسال رابط الاستعادة
        </p>

        <form id="resetForm">

            <label for="email">البريد الإلكتروني</label>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <button type="submit">
                إرسال رابط الاستعادة
            </button>

        </form>

        <div id="message" class="message"></div>

        <a href="login.html" class="back">
            العودة لتسجيل الدخول
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            message.className = "message";
            message.textContent = "";

            const { error } = await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo: "https://arrabnet.com/reset-password.html"
                }
            );

            if (error) {
                message.className = "message error";
                message.textContent = "تعذر إرسال رابط الاستعادة. حاول مرة أخرى.";
                return;
            }

            message.className = "message success";
            message.textContent = "تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني.";
        });
    </script>

</body>
</html>
