<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة | عرّاب الشبكات</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Tajawal", sans-serif;
            background: #cbb77a;
            color: #111;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
        }

        .admin-badge {
            background: #cbb77a;
            color: #111;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255,255,255,0.35);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .loading {
            text-align: center;
            font-size: 18px;
            padding: 30px;
        }

        .error {
            background: #b91c1c;
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">🌐 عرّاب الشبكات</div>
        <div class="admin-badge">ADMIN</div>
    </nav>

    <main class="container">

        <h1>🛠️ لوحة الإدارة</h1>

        <div class="card">

            <div id="loading" class="loading">
                جاري التحقق من صلاحيات الحساب...
            </div>

            <div id="error" class="error"></div>

            <div id="adminContent" style="display:none;">
                <h2>مرحباً بك في لوحة الإدارة 👋</h2>
                <p>
                    تم التحقق من أن هذا الحساب يمتلك صلاحية Admin.
                </p>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>

</body>
</html>
