<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تغيير كلمة المرور | عرّاب الشبكات</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Tajawal", sans-serif;
            background: #cbb77a;
            color: #111;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #111;
            color: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 28px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;

            border: none;
            border-radius: 12px;

            font-family: inherit;
            font-size: 16px;

            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: #cbb77a;
            color: #111;

            font-family: inherit;
            font-size: 17px;
            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            display: none;
        }

        .success {
            display: block !important;
            background: #166534;
            color: white;
        }

        .error {
            display: block !important;
            background: #b91c1c;
            color: white;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #bbb;
        }

        .login-link a {
            color: #cbb77a;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">🌐</div>

        <h1>تغيير كلمة المرور</h1>

        <div class="subtitle">
            أدخل كلمة المرور الجديدة لحسابك
        </div>

        <form id="updatePasswordForm">

            <label for="newPassword">
                كلمة المرور الجديدة
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="أدخل كلمة المرور الجديدة"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                تأكيد كلمة المرور
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                minlength="6"
                required
            >

            <button type="submit" id="updateButton">
                تغيير كلمة المرور
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            <a href="login.html">العودة إلى تسجيل الدخول</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const form = document.getElementById("updatePasswordForm");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const updateButton = document.getElementById("updateButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }

        async function checkRecoverySession() {

            const {
                data: { session },
                error
            } = await supabaseClient.auth.getSession();

            if (error || !session) {
                showMessage(
                    "رابط الاستعادة غير صالح أو انتهت صلاحيته.",
                    "error"
                );

                updateButton.disabled = true;
                return false;
            }

            return true;
        }

        checkRecoverySession();

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            if (password.length < 6) {
                showMessage(
                    "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
                    "error"
                );
                return;
            }

            if (password !== confirmation) {
                showMessage(
                    "كلمتا المرور غير متطابقتين.",
                    "error"
                );
                return;
            }

            updateButton.disabled = true;
            updateButton.textContent = "جاري تغيير كلمة المرور...";

            try {

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {
                    throw error;
                }

                showMessage(
                    "تم تغيير كلمة المرور بنجاح. سيتم تحويلك لتسجيل الدخول.",
                    "success"
                );

                form.reset();

                setTimeout(async function() {

                    await supabaseClient.auth.signOut();

                    window.location.href = "login.html";

                }, 2000);

            } catch (error) {

                console.error(
                    "Update password error:",
                    error
                );

                showMessage(
                    error.message ||
                    "حدث خطأ أثناء تغيير كلمة المرور.",
                    "error"
                );

                updateButton.disabled = false;
                updateButton.textContent = "تغيير كلمة المرور";
            }

        });
    </script>

</body>
</html>
